<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0F3554"><title>Locly — Administration</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>
:root{--a:#0F3554;--t:#1AA696;--s:#5A7182;--g:#D0D7DE;--bg:#f5f8fa;--danger:#c9362f;--warn:#a86a00;--card:#fff;--shadow:0 10px 35px rgba(15,53,84,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--a);font-family:"DM Sans",system-ui,sans-serif}.admin{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0F3554,#092b45);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.logo{padding:8px 12px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}.logo b{font:800 25px Manrope}.logo small{display:block;color:#9fb5c4;margin-top:4px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7f9aab;padding:14px 12px 7px;font-weight:800}.side button{width:100%;border:0;background:transparent;color:#d9e5eb;padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer;margin:2px 0;font-weight:650;display:flex;align-items:center;gap:10px}.side button:hover,.side button.active{background:rgba(26,166,150,.18);color:#fff}.side button.active{box-shadow:inset 3px 0 var(--t)}.side-footer{margin-top:25px;padding:14px 12px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#8fa8b7}.main{min-width:0;padding:26px clamp(18px,3vw,40px) 60px;max-width:1600px;width:100%}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.title h1{font:800 clamp(25px,3vw,34px) Manrope;margin:4px 0}.title p{margin:0;color:var(--s);font-size:13px}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--g);background:#fff;color:var(--a);border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(15,53,84,.08)}.primary{background:var(--t);border-color:var(--t);color:#fff}.danger{color:var(--danger);background:#fff1f0;border-color:#ffd4d1}.ghost{background:transparent}.live{display:inline-flex;align-items:center;gap:7px;background:#eaf8f1;color:#146b40;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:#16834b}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.metric{background:var(--card);border:1px solid var(--g);border-radius:15px;padding:17px;box-shadow:var(--shadow);min-width:0}.metric .ico{font-size:20px}.metric span{display:block;color:var(--s);font-size:11px;margin-top:9px}.metric strong{display:block;font:800 27px Manrope;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric em{font-style:normal;font-size:10px;color:var(--t);font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.45fr);gap:15px;margin-top:15px}.card{background:#fff;border:1px solid var(--g);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:17px 18px;border-bottom:1px solid #edf1f3}.card-head h2{font:800 16px Manrope;margin:0}.card-body{padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick .btn{text-align:left;min-height:62px}.quick b{display:block}.quick small{display:block;color:var(--s);margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.input,.toolbar select{border:1px solid var(--g);background:#fff;border-radius:9px;padding:10px 11px;outline:0}.input:focus,.toolbar select:focus{border-color:var(--t);box-shadow:0 0 0 3px rgba(26,166,150,.12)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #edf1f3;text-align:left;font-size:12px;vertical-align:middle}.table th{font-size:10px;color:var(--s);text-transform:uppercase;letter-spacing:.06em}.pill{display:inline-flex;padding:5px 8px;border-radius:99px;background:#e8f6f4;color:var(--t);font-size:10px;font-weight:800}.pill.red{background:#fff0ef;color:var(--danger)}.pill.yellow{background:#fff6e5;color:var(--warn)}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{padding:7px 9px;font-size:11px}.empty{text-align:center;padding:45px;color:var(--s)}.alert{padding:12px;border-radius:10px;margin-bottom:9px;background:#fff6e5;color:#795000;font-size:12px}.alert.red{background:#fff0ef;color:#9f2924}.alert.green{background:#eaf8f1;color:#146b40}.statline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f3;font-size:12px}.statline:last-child{border-bottom:0}.bar{height:7px;background:#edf1f3;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--t);border-radius:99px}.command{position:fixed;inset:0;background:rgba(5,22,34,.48);backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:100}.command.open{display:flex}.command-box{width:min(620px,92%);background:#fff;border-radius:16px;box-shadow:0 25px 80px rgba(0,0,0,.25);overflow:hidden}.command input{width:100%;border:0;border-bottom:1px solid var(--g);padding:17px;font-size:16px;outline:0}.command-list button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:14px 17px;cursor:pointer}.command-list button:hover{background:#f1faf8}.toast{position:fixed;right:20px;bottom:20px;background:var(--a);color:#fff;padding:12px 15px;border-radius:10px;z-index:200;box-shadow:var(--shadow);font-size:12px}.mobile-menu{display:none}@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:760px){.admin{display:block}.side{position:fixed;left:-270px;z-index:90;width:250px;transition:.2s}.side.open{left:0}.mobile-menu{display:block}.metrics{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top{align-items:flex-start}.top-actions .back{display:none}}@media(max-width:480px){.metrics{grid-template-columns:1fr}.quick{grid-template-columns:1fr}}
</style></head><body><div class="admin"><aside class="side" id="side"><div class="logo"><b>locly</b><small>Centre d'administration</small></div><div class="nav-label">Pilotage</div><button class="active" onclick="show('overview',this)">📊 <span>Vue générale</span></button><button onclick="show('users',this)">👥 <span>Utilisateurs</span></button><button onclick="show('reports',this)">🚨 <span>Signalements</span></button><button onclick="show('ips',this)">🛡️ <span>Sécurité & IP</span></button><div class="nav-label">Opérations</div><button onclick="show('ledger',this)">💶 <span>Finance</span></button><button onclick="show('audit',this)">📜 <span>Journal d'audit</span></button><button onclick="show('presence',this)">🟢 <span>Présence</span></button><div class="nav-label">Outils</div><button onclick="openCommand()">⌘ <span>Recherche rapide</span></button><button onclick="refresh()">↻ <span>Actualiser</span></button><div class="side-footer">Locly Security · RBAC actif<br>Les actions sensibles sont journalisées.</div></aside><main class="main"><div class="top"><div class="title"><div class="eyebrow">Administration sécurisée</div><h1 id="title">Vue générale</h1><p id="subtitle">Pilotage de la marketplace Locly</p></div><div class="top-actions"><span class="live"><i class="dot"></i><span id="liveText">Connexion sécurisée</span></span><button class="btn mobile-menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><button class="btn back" onclick="location.href='/'">← Locly</button></div></div><section id="content"></section></main></div><div class="command" id="command" onclick="if(event.target===this)closeCommand()"><div class="command-box"><input id="commandInput" placeholder="Rechercher une action…" oninput="filterCommands()"><div class="command-list" id="commandList"></div></div></div><div id="toast"></div><script>
const token=localStorage.getItem('locly_token')||localStorage.getItem('token');const content=document.getElementById('content');const title=document.getElementById('title');const subtitle=document.getElementById('subtitle');let overviewCache=null;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=x=>Number(x||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='toast';setTimeout(()=>t.className='',2500)}async function api(path,opt={}){const r=await fetch('http://localhost:3001/api/admin'+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'}});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Erreur serveur');return x}function nav(page){const labels={overview:['Vue générale','Pilotage de la marketplace'],users:['Utilisateurs','Comptes, rôles et modération'],reports:['Signalements','Litiges et modération'],ips:['Sécurité & IP','Contrôles réseau et prévention'],ledger:['Finance','Suivi des mouvements'],audit:['Journal d’audit','Traçabilité des actions administratives'],presence:['Présence','Activité en temps réel']};title.textContent=labels[page][0];subtitle.textContent=labels[page][1];document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'))}
async function show(page,btn){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');nav(page);try{if(page==='overview')return overview();if(page==='users')return users();if(page==='reports')return reports();if(page==='ips')return ips();if(page==='ledger')return ledger();if(page==='audit')return audit();if(page==='presence')return presence()}catch(e){content.innerHTML='<div class="card"><div class="card-body"><div class="alert red"><b>Accès refusé / erreur</b><br>'+esc(e.message)+'</div><button class="btn" onclick="refresh()">Réessayer</button></div></div>'}}
async function overview(){const x=await api('/overview');overviewCache=x;content.innerHTML='<div class="metrics"><div class="metric"><div class="ico">👥</div><span>Utilisateurs</span><strong>'+x.users+'</strong></div><div class="metric"><div class="ico">🟢</div><span>Actifs</span><strong>'+x.active+'</strong></div><div class="metric"><div class="ico">🚫</div><span>Suspendus</span><strong>'+x.suspended+'</strong></div><div class="metric"><div class="ico">📦</div><span>Annonces</span><strong>'+x.listings+'</strong></div><div class="metric"><div class="ico">💶</div><span>Volume traité</span><strong>'+money(x.processedMoney)+'</strong></div></div><div class="layout"><div><div class="card"><div class="card-head"><h2>⚡ Actions rapides</h2><span class="pill">RBAC</span></div><div class="card-body"><div class="quick"><button class="btn" onclick="show('users')"><b>👥 Gérer les utilisateurs</b><small>Recherche, suspension, rôles</small></button><button class="btn" onclick="show('reports')"><b>🚨 Traiter les signalements</b><small>Modérer les dossiers</small></button><button class="btn" onclick="show('ips')"><b>🛡️ Centre sécurité</b><small>IP et contrôles réseau</small></button><button class="btn" onclick="show('ledger')"><b>💶 Contrôler les finances</b><small>Ledger et mouvements</small></button></div></div></div><div class="grid2" style="margin-top:15px"><div class="card"><div class="card-head"><h2>📈 État plateforme</h2></div><div class="card-body"><div class="statline"><span>Comptes actifs</span><b>'+x.active+'/'+x.users+'</b></div><div class="bar"><i style="width:'+Math.min(100,(x.users?x.active/x.users*100:0))+'%"></i></div><div class="statline"><span>Signalements ouverts</span><b>'+x.openReports+'</b></div><div class="statline"><span>Locations</span><b>'+x.bookings+'</b></div></div></div><div class="card"><div class="card-head"><h2>🔐 Sécurité</h2></div><div class="card-body"><div class="alert green">✓ Contrôle RBAC actif</div><div class="alert">Les opérations administratives sont journalisées.</div><button class="btn" onclick="show('audit')">Voir le journal →</button></div></div></div></div><div><div class="card"><div class="card-head"><h2>🧭 Navigation</h2></div><div class="card-body"><div class="action-list"><button class="btn" onclick="show('presence')">🟢 Présence temps réel</button><button class="btn" onclick="show('audit')">📜 Dernières actions</button><button class="btn" onclick="openCommand()">⌘ Ouvrir la recherche</button></div></div></div></div></div>'}
async function users(){const x=await api('/users');content.innerHTML='<div class="card"><div class="card-head"><h2>Utilisateurs <span class="pill">'+x.users.length+'</span></h2></div><div class="card-body"><div class="toolbar"><input class="input" id="uq" placeholder="Nom ou email" oninput="filterTable('usersTable','uq')"><select id="urole" onchange="filterRole()"><option value="">Tous les rôles</option><option>user</option><option>moderator</option><option>finance</option><option>admin</option><option>superadmin</option></select><select id="ustatus" onchange="filterStatus()"><option value="">Tous les statuts</option><option>active</option><option>suspended</option></select><button class="btn" onclick="exportTable('usersTable','locly-utilisateurs.csv')">↓ Export CSV</button></div><div class="table-wrap"><table class="table" id="usersTable"><thead><tr><th>ID</th><th>Utilisateur</th><th>Rôle</th><th>Trust</th><th>Statut</th><th>Actions</th></tr></thead><tbody>'+x.users.map(u=>`<tr data-role="${esc(u.role)}" data-status="${esc(u.status)}"><td>${u.id}</td><td><b>${esc(u.name)}</b><br><small>${esc(u.email)}</small></td><td><span class="pill">${esc(u.role)}</span></td><td>${u.trust_score}/100</td><td><span class="pill ${u.status==='suspended'?'red':''}">${esc(u.status)}</span></td><td class="actions">${u.status==='active'?`<button class="btn danger mini" onclick="ban(${u.id})">Bannir</button>`:`<button class="btn primary mini" onclick="unban(${u.id})">Réactiver</button>`}</td></tr>`).join('')+'</tbody></table></div></div></div>'}
function filterTable(id,input){const q=document.getElementById(input).value.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}function filterRole(){const q=document.getElementById('urole').value;document.querySelectorAll('#usersTable tbody tr').forEach(r=>r.style.display=(!q||r.dataset.role===q)?'':'none')}function filterStatus(){const q=document.getElementById('ustatus').value;document.querySelectorAll('#usersTable tbody tr').forEach(r=>r.style.display=(!q||r.dataset.status===q)?'':'none')}
async function reports(){const x=await api('/reports');content.innerHTML='<div class="card"><div class="card-head"><h2>🚨 Signalements</h2><span class="pill yellow">'+x.reports.length+' dossiers</span></div><div class="card-body"><div class="toolbar"><input class="input" placeholder="Filtrer les signalements" oninput="filterTable(\'reportsTable\',\'this\')"></div><div class="table-wrap"><table class="table" id="reportsTable"><thead><tr><th>ID</th><th>Signalé</th><th>Motif</th><th>Détails</th><th>Action</th></tr></thead><tbody>'+x.reports.map(r=>`<tr><td>#${r.id}</td><td><b>${esc(r.target_name)}</b></td><td><span class="pill yellow">${esc(r.reason)}</span></td><td>${esc(r.details)}</td><td class="actions"><button class="btn mini" onclick="resolve(${r.id},'resolved')">Classer</button><button class="btn danger mini" onclick="resolve(${r.id},'confirmed')">Confirmer</button></td></tr>`).join('')+'</tbody></table></div></div></div>'}
async function ips(){const x=await api('/ips');content.innerHTML='<div class="card"><div class="card-head"><h2>🛡️ IP & sécurité</h2><span class="pill">Accès restreint</span></div><div class="card-body"><div class="alert">Les IP sont des données personnelles. Leur accès doit rester limité aux rôles autorisés.</div><div class="toolbar"><input class="input" id="ip" placeholder="Adresse IP"><input class="input" id="reason" placeholder="Motif du blocage"><button class="btn danger" onclick="blockIp()">Bloquer l’IP</button></div><div class="table-wrap"><table class="table"><thead><tr><th>IP</th><th>Action</th><th>Motif</th><th>Date</th><th></th></tr></thead><tbody>'+x.ips.map(i=>`<tr><td><b>${esc(i.ip)}</b></td><td>${esc(i.action)}</td><td>${esc(i.reason)}</td><td>${esc(i.created_at)}</td><td><button class="btn mini" onclick="unblockIp('${esc(i.ip)}')">Débloquer</button></td></tr>`).join('')+'</tbody></table></div></div></div>'}
async function ledger(){const x=await api('/ledger');content.innerHTML='<div class="card"><div class="card-head"><h2>💶 Ledger financier</h2><button class="btn" onclick="exportTable(\'ledgerTable\',\'locly-ledger.csv\')">↓ Export CSV</button></div><div class="card-body"><div class="table-wrap"><table class="table" id="ledgerTable"><thead><tr><th>Date</th><th>Type</th><th>Montant</th><th>Statut</th><th>Référence</th></tr></thead><tbody>'+x.ledger.map(i=>`<tr><td>${esc(i.created_at)}</td><td>${esc(i.type)}</td><td><b>${money(i.amount)}</b></td><td><span class="pill">${esc(i.status)}</span></td><td>${esc(i.reference)}</td></tr>`).join('')+'</tbody></table></div></div></div>'}
async function audit(){const x=await api('/audit');content.innerHTML='<div class="card"><div class="card-head"><h2>📜 Journal d’audit</h2><span class="pill">Traçabilité</span></div><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Cible</th><th>IP</th></tr></thead><tbody>'+x.logs.map(i=>`<tr><td>${esc(i.created_at)}</td><td>${esc(i.admin_name)}</td><td><b>${esc(i.action)}</b></td><td>${esc(i.target_type)} #${i.target_id||''}</td><td>${esc(i.ip)}</td></tr>`).join('')+'</tbody></table></div></div></div>'}
async function presence(){try{const x=await fetch('http://localhost:3002/api/presence/stats',{headers:{Authorization:'Bearer '+token}});const d=await x.json();content.innerHTML='<div class="metrics"><div class="metric"><div class="ico">🟢</div><span>En ligne</span><strong>'+Number(d.online||0)+'</strong></div><div class="metric"><div class="ico">👤</div><span>Comptes actifs</span><strong>'+Number(d.authenticated||0)+'</strong></div><div class="metric"><div class="ico">👀</div><span>Visiteurs</span><strong>'+Number(d.guests||0)+'</strong></div><div class="metric"><div class="ico">📅</div><span>Aujourd’hui</span><strong>'+Number(d.today||0)+'</strong></div><div class="metric"><div class="ico">🌐</div><span>IP actives</span><strong>'+Number(d.activeIps||0)+'</strong></div></div><div class="card" style="margin-top:15px"><div class="card-head"><h2>Présence temps réel</h2><button class="btn" onclick="presence()">↻ Actualiser</button></div><div class="card-body"><div class="alert green">✓ Le heartbeat Locly actualise automatiquement les présences.</div><p style="color:var(--s);font-size:12px">Les IP et informations techniques sont réservées aux fonctions de sécurité autorisées.</p></div></div>'}catch(e){content.innerHTML='<div class="card"><div class="card-body"><div class="alert red">Service présence indisponible : '+esc(e.message)+'</div></div></div>'}}
async function ban(id){const reason=prompt('Motif du bannissement ?');if(reason===null||!reason.trim())return;await api('/users/'+id+'/ban',{method:'POST',body:JSON.stringify({reason})});toast('Utilisateur suspendu');users()}async function unban(id){await api('/users/'+id+'/unban',{method:'POST',body:'{}'});toast('Utilisateur réactivé');users()}async function resolve(id,status){await api('/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({status})});toast('Signalement mis à jour');reports()}async function blockIp(){const ip=document.getElementById('ip').value.trim(),reason=document.getElementById('reason').value.trim();if(!ip)return toast('Adresse IP requise');await api('/ips/block',{method:'POST',body:JSON.stringify({ip,reason})});toast('IP bloquée');ips()}async function unblockIp(ip){await api('/ips/unblock',{method:'POST',body:JSON.stringify({ip})});toast('IP débloquée');ips()}
function exportTable(id,name){const t=document.getElementById(id);if(!t)return;const rows=[...t.querySelectorAll('tr')].map(r=>[...r.children].map(c=>'"'+c.innerText.replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast('Export créé')}
const commands=[['Vue générale','overview'],['Utilisateurs','users'],['Signalements','reports'],['Sécurité & IP','ips'],['Finance','ledger'],['Journal d’audit','audit'],['Présence','presence']];function renderCommands(list=commands){document.getElementById('commandList').innerHTML=list.map(c=>`<button onclick="closeCommand();show('${c[1]}')">${c[0]}</button>`).join('')}function openCommand(){document.getElementById('command').classList.add('open');document.getElementById('commandInput').value='';renderCommands();setTimeout(()=>document.getElementById('commandInput').focus(),20)}function closeCommand(){document.getElementById('command').classList.remove('open')}function filterCommands(){const q=document.getElementById('commandInput').value.toLowerCase();renderCommands(commands.filter(c=>c[0].toLowerCase().includes(q)))}function refresh(){show('overview',document.querySelector('.side button'))}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}if(e.key==='Escape')closeCommand()});show('overview',document.querySelector('.side button.active'));
setInterval(()=>{if(document.getElementById('title').textContent==='Présence')presence()},15000);
</script></body></html>
