<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locly — Administration</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{--a:#0F3554;--t:#1AA696;--s:#5A7182;--g:#D0D7DE;--bg:#f5f8fa;--danger:#c9362f;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--a);font-family:system-ui,sans-serif}.admin{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0F3554,#092b45);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.logo{padding:8px 12px 20px;border-bottom:1px solid #ffffff1a;margin-bottom:12px}.logo b{font-size:26px}.logo small{display:block;color:#9fb5c4;margin-top:4px}.nav-label{font-size:10px;color:#8fa8b7;text-transform:uppercase;margin:16px 12px 6px}.side button{width:100%;border:0;background:transparent;color:#d9e5eb;padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;margin:2px 0;font-weight:650}.side button:hover,.side button.active{background:#1AA696;color:#fff}.main{padding:28px;max-width:1600px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--t);font-weight:800}.title h1{margin:5px 0;font-size:32px}.title p{margin:0;color:var(--s)}.btn{border:1px solid var(--g);background:#fff;color:var(--a);border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--t);border-color:var(--t);color:#fff}.danger{background:#fff0ef;border-color:#ffd0cc;color:var(--danger)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric,.card{background:var(--card);border:1px solid var(--g);border-radius:14px;box-shadow:0 8px 28px #0f35540d}.metric{padding:17px}.metric span{display:block;color:var(--s);font-size:11px;margin-top:8px}.metric strong{display:block;font-size:27px;margin-top:4px}.card{margin-top:15px;overflow:hidden}.card-head{padding:16px 18px;border-bottom:1px solid #edf1f3;display:flex;justify-content:space-between}.card-head h2{margin:0;font-size:16px}.card-body{padding:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.input,.toolbar select{padding:10px;border:1px solid var(--g);border-radius:9px;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:11px 10px;border-bottom:1px solid #edf1f3;text-align:left;font-size:12px}.table th{font-size:10px;color:var(--s);text-transform:uppercase}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#e8f6f4;color:var(--t);font-size:10px;font-weight:800}.pill.red{background:#fff0ef;color:var(--danger)}.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;padding:40px;color:var(--s)}.alert{padding:12px;border-radius:9px;background:#fff6e5;color:#795000;margin-bottom:10px}.alert.red{background:#fff0ef;color:#9f2924}.alert.green{background:#eaf8f1;color:#146b40}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick .btn{text-align:left;min-height:65px}.quick small{display:block;color:var(--s);margin-top:4px}@media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.admin{display:block}.side{position:relative;height:auto}.main{padding:18px}.metrics{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr}.top{align-items:flex-start}}@media(max-width:480px){.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="admin">
<aside class="side">
<div class="logo"><b>locly</b><small>Centre d'administration</small></div>
<div class="nav-label">Pilotage</div>
<button class="active" onclick="show('overview',this)">📊 Vue générale</button>
<button onclick="show('users',this)">👥 Utilisateurs</button>
<button onclick="show('reports',this)">🚨 Signalements</button>
<button onclick="show('ips',this)">🛡️ Sécurité & IP</button>
<div class="nav-label">Opérations</div>
<button onclick="show('ledger',this)">💶 Finance</button>
<button onclick="show('audit',this)">📜 Journal d’audit</button>
<button onclick="show('presence',this)">🟢 Présence</button>
<div class="nav-label">Outils</div>
<button onclick="refresh()">↻ Actualiser</button>
<div style="margin-top:20px;padding:12px;border-top:1px solid #ffffff1a;font-size:11px;color:#8fa8b7">Locly Security · RBAC actif</div>
</aside>
<main class="main">
<div class="top"><div class="title"><div class="eyebrow">Administration sécurisée</div><h1 id="title">Vue générale</h1><p id="subtitle">Pilotage de la marketplace Locly</p></div><button class="btn" onclick="location.href='/'">← Locly</button></div>
<section id="content"></section>
</main>
</div>
<script>
'use strict';
const token=localStorage.getItem('locly_token')||localStorage.getItem('token');
const content=document.getElementById('content');
const title=document.getElementById('title');
const subtitle=document.getElementById('subtitle');
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
const money=value=>Number(value||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
async function api(path,options={}){if(!token)throw new Error('Session administrateur absente');const response=await fetch('http://localhost:3001/api/admin'+path,{...options,headers:{...(options.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Erreur serveur');return data}
function setPage(name,description){title.textContent=name;subtitle.textContent=description}
function setActive(btn){document.querySelectorAll('.side button').forEach(button=>button.classList.remove('active'));if(btn)btn.classList.add('active')}
function fail(error){content.innerHTML='<div class="card"><div class="card-body"><div class="alert red"><b>Impossible de charger cette section</b><br>'+esc(error.message)+'</div><button class="btn primary" onclick="refresh()">Réessayer</button></div></div>'}
async function show(page,btn){setActive(btn);try{if(page==='overview')return await overview();if(page==='users')return await users();if(page==='reports')return await reports();if(page==='ips')return await ips();if(page==='ledger')return await ledger();if(page==='audit')return await audit();if(page==='presence')return await presence();}catch(error){fail(error)}}
async function overview(){setPage('Vue générale','Pilotage de la marketplace Locly');const x=await api('/overview');content.innerHTML='<div class="metrics"><div class="metric">👥<span>Utilisateurs</span><strong>'+x.users+'</strong></div><div class="metric">🟢<span>Actifs</span><strong>'+x.active+'</strong></div><div class="metric">🚫<span>Suspendus</span><strong>'+x.suspended+'</strong></div><div class="metric">📦<span>Annonces</span><strong>'+x.listings+'</strong></div><div class="metric">💶<span>Volume traité</span><strong>'+money(x.processedMoney)+'</strong></div></div><div class="card"><div class="card-head"><h2>⚡ Centre de contrôle</h2><span class="pill">RBAC actif</span></div><div class="card-body"><div class="quick"><button class="btn" onclick="show('users')"><b>👥 Utilisateurs</b><small>Comptes, rôles et modération</small></button><button class="btn" onclick="show('reports')"><b>🚨 Signalements</b><small>Litiges et modération</small></button><button class="btn" onclick="show('ips')"><b>🛡️ Sécurité & IP</b><small>Contrôles réseau</small></button><button class="btn" onclick="show('presence')"><b>🟢 Présence</b><small>Activité en temps réel</small></button></div></div></div>'}
async function users(){setPage('Utilisateurs','Comptes, rôles et modération');const x=await api('/users');content.innerHTML='<div class="card"><div class="card-body"><div class="toolbar"><input class="input" id="userSearch" placeholder="Nom ou email" oninput="filterUsers()"><select class="input" id="roleFilter" onchange="filterUsers()"><option value="">Tous les rôles</option><option>user</option><option>moderator</option><option>finance</option><option>admin</option><option>superadmin</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Utilisateur</th><th>Rôle</th><th>Trust</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="usersBody">'+x.users.map(userRow).join('')+'</tbody></table></div></div></div>';window._users=x.users}
function userRow(u){return '<tr><td>'+u.id+'</td><td>'+esc(u.name)+'<br><small>'+esc(u.email)+'</small></td><td>'+esc(u.role)+'</td><td>'+u.trust_score+'/100</td><td><span class="pill '+(u.status==='suspended'?'red':'')+'">'+esc(u.status)+'</span></td><td class="actions">'+(u.status==='active'?'<button class="btn danger" onclick="banUser('+u.id+')">Bannir</button>':'<button class="btn primary" onclick="unbanUser('+u.id+')">Réactiver</button>')+'</td></tr>'}
function filterUsers(){const q=(document.getElementById('userSearch')?.value||'').toLowerCase();const role=document.getElementById('roleFilter')?.value||'';const rows=(window._users||[]).filter(u=>(!q||String(u.name+' '+u.email).toLowerCase().includes(q))&&(!role||u.role===role));const body=document.getElementById('usersBody');if(body)body.innerHTML=rows.map(userRow).join('')||'<tr><td colspan="6" class="empty">Aucun utilisateur</td></tr>'}
async function banUser(id){const reason=prompt('Motif du bannissement ?');if(reason===null)return;await api('/users/'+id+'/ban',{method:'POST',body:JSON.stringify({reason})});await users()}
async function unbanUser(id){await api('/users/'+id+'/unban',{method:'POST',body:'{}'});await users()}
async function reports(){setPage('Signalements','Litiges et modération');const x=await api('/reports');content.innerHTML='<div class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Signalé</th><th>Motif</th><th>Détails</th><th>Action</th></tr></thead><tbody>'+x.reports.map(r=>'<tr><td>'+r.id+'</td><td>'+esc(r.target_name)+'</td><td>'+esc(r.reason)+'</td><td>'+esc(r.details)+'</td><td class="actions"><button class="btn" onclick="resolveReport('+r.id+',\'resolved\')">Classer</button><button class="btn danger" onclick="resolveReport('+r.id+',\'confirmed\')">Confirmer</button></td></tr>').join('')+'</tbody></table></div></div></div>'}
async function resolveReport(id,status){await api('/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({status})});await reports()}
async function ips(){setPage('Sécurité & IP','Contrôles réseau et prévention');const x=await api('/ips');content.innerHTML='<div class="card"><div class="card-body"><div class="toolbar"><input class="input" id="ip" placeholder="Adresse IP"><input class="input" id="reason" placeholder="Motif"><button class="btn danger" onclick="blockIp()">Bloquer</button></div><div class="table-wrap"><table class="table"><thead><tr><th>IP</th><th>Action</th><th>Motif</th><th>Date</th><th></th></tr></thead><tbody>'+x.ips.map(i=>'<tr><td>'+esc(i.ip)+'</td><td>'+esc(i.action)+'</td><td>'+esc(i.reason)+'</td><td>'+esc(i.created_at)+'</td><td><button class="btn" onclick="unblockIp('+JSON.stringify(i.ip)+')">Débloquer</button></td></tr>').join('')+'</tbody></table></div></div></div>'}
async function blockIp(){const ip=document.getElementById('ip')?.value.trim();const reason=document.getElementById('reason')?.value.trim();if(!ip)return alert('Adresse IP requise');await api('/ips/block',{method:'POST',body:JSON.stringify({ip,reason})});await ips()}
async function unblockIp(ip){await api('/ips/unblock',{method:'POST',body:JSON.stringify({ip})});await ips()}
async function ledger(){setPage('Finance','Suivi des mouvements');const x=await api('/ledger');content.innerHTML='<div class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Montant</th><th>Statut</th><th>Référence</th></tr></thead><tbody>'+x.ledger.map(i=>'<tr><td>'+esc(i.created_at)+'</td><td>'+esc(i.type)+'</td><td>'+money(i.amount)+'</td><td>'+esc(i.status)+'</td><td>'+esc(i.reference)+'</td></tr>').join('')+'</tbody></table></div></div></div>'}
async function audit(){setPage('Journal d’audit','Traçabilité des actions administratives');const x=await api('/audit');content.innerHTML='<div class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Cible</th><th>IP</th></tr></thead><tbody>'+x.logs.map(i=>'<tr><td>'+esc(i.created_at)+'</td><td>'+esc(i.admin_name)+'</td><td>'+esc(i.action)+'</td><td>'+esc(i.target_type)+' #'+esc(i.target_id||'')+'</td><td>'+esc(i.ip)+'</td></tr>').join('')+'</tbody></table></div></div></div>'}
async function presence(){setPage('Présence','Activité en temps réel');try{const r=await fetch('http://localhost:3000/api/presence/stats',{headers:{Authorization:'Bearer '+token}});const x=await r.json();if(!r.ok)throw new Error(x.error||'Présence indisponible');content.innerHTML='<div class="metrics"><div class="metric">🟢<span>En ligne</span><strong>'+Number(x.online||0)+'</strong></div><div class="metric">👤<span>Comptes actifs</span><strong>'+Number(x.authenticated||0)+'</strong></div><div class="metric">👀<span>Visiteurs</span><strong>'+Number(x.guests||0)+'</strong></div></div><div class="card"><div class="card-head"><h2>Présence</h2><span class="pill">Temps réel</span></div><div class="card-body"><p>Dernière actualisation : '+new Date().toLocaleTimeString('fr-FR')+'</p><button class="btn primary" onclick="presence()">↻ Actualiser</button></div></div>'}catch(error){content.innerHTML='<div class="card"><div class="card-body"><div class="alert">Présence indisponible : '+esc(error.message)+'</div><p>Le reste du centre d’administration reste opérationnel.</p></div></div>'}}
function refresh(){show('overview',document.querySelector('.side button'))}
window.show=show;window.refresh=refresh;window.banUser=banUser;window.unbanUser=unbanUser;window.resolveReport=resolveReport;window.blockIp=blockIp;window.unblockIp=unblockIp;window.presence=presence;
show('overview',document.querySelector('.side button.active'));
</script>
</body>
</html>
