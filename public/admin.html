<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locly Admin</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f7f8}.admin{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#0F3554;color:white;padding:25px;position:sticky;top:0;height:100vh}.side h1{margin:0 0 28px}.side button{display:block;width:100%;margin:7px 0;padding:12px;border:0;border-radius:9px;background:transparent;color:#dce6ec;text-align:left;cursor:pointer}.side button.active,.side button:hover{background:#1AA696;color:#fff}.main{padding:32px;max-width:1400px;width:100%}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.box{background:#fff;border:1px solid #D0D7DE;border-radius:14px;padding:20px;margin-bottom:16px}.metric small{color:#5A7182}.metric strong{display:block;font-size:30px;margin-top:6px}.toolbar{display:flex;gap:9px;margin-bottom:15px}.toolbar input,.toolbar select{padding:11px;border:1px solid #D0D7DE;border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #edf1f3;font-size:13px}.pill{padding:5px 8px;border-radius:99px;background:#e8f6f4;color:#1AA696;font-weight:700;font-size:11px}.danger{background:#fff0ef;color:#c9362f}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{cursor:pointer}.empty{padding:30px;text-align:center;color:#5A7182}@media(max-width:800px){.admin{grid-template-columns:1fr}.side{height:auto;position:relative}.grid{grid-template-columns:1fr 1fr}.main{padding:18px}.table{min-width:800px}.box{overflow:auto}}</style></head><body><div class="admin"><aside class="side"><h1>Locly <small>Admin</small></h1><button class="active" onclick="show('overview',this)">📊 Vue générale</button><button onclick="show('users',this)">👥 Utilisateurs</button><button onclick="show('reports',this)">🚨 Signalements</button><button onclick="show('ips',this)">🛡️ IP / sécurité</button><button onclick="show('ledger',this)">💶 Finance</button><button onclick="show('audit',this)">📜 Journal d'audit</button></aside><main class="main"><div class="head"><div><div class="eyebrow">Administration</div><h1 id="title">Vue générale</h1></div><button class="btn btn-light" onclick="location.href='/'">← Retour à Locly</button></div><section id="content"></section></main></div><script>const token=localStorage.getItem('locly_token')||localStorage.getItem('token');const content=document.getElementById('content');const title=document.getElementById('title');function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch('http://localhost:3001/api/admin'+path,opt).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||'Erreur');return x})}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function show(page,btn){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');title.textContent={overview:'Vue générale',users:'Utilisateurs',reports:'Signalements',ips:'IP / sécurité',ledger:'Finance',audit:'Journal d’audit'}[page];try{if(page==='overview'){const x=await api('/overview');content.innerHTML='<div class="grid">'+[['Utilisateurs',x.users],['Actifs',x.active],['Suspendus',x.suspended],['Annonces',x.listings],['Locations',x.bookings],['Signalements ouverts',x.openReports],['Volume traité',x.processedMoney.toFixed(2)+' €']].map(a=>`<div class="box metric"><small>${a[0]}</small><strong>${a[1]}</strong></div>`).join('')+'</div><div class="box"><h2>Centre de contrôle</h2><p>Utilisez les sections à gauche pour modérer les comptes, traiter les signalements, gérer les contrôles IP et suivre le ledger financier.</p></div>'}else if(page==='users'){const x=await api('/users');content.innerHTML='<div class="box"><div class="toolbar"><input id="q" placeholder="Nom ou email"><button class="btn btn-primary" onclick="loadUsers()">Rechercher</button></div><div style="overflow:auto"><table class="table"><tr><th>ID</th><th>Utilisateur</th><th>Rôle</th><th>Trust</th><th>Statut</th><th>Actions</th></tr>'+x.users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name)}<br><small>${esc(u.email)}</small></td><td>${esc(u.role)}</td><td>${u.trust_score}/100</td><td><span class="pill ${u.status==='suspended'?'danger':''}">${u.status}</span></td><td class="actions">${u.status==='active'?`<button class="btn btn-danger" onclick="ban(${u.id})">Bannir</button>`:`<button class="btn btn-primary" onclick="unban(${u.id})">Réactiver</button>`}</td></tr>`).join('')+'</table></div></div>'}else if(page==='reports'){const x=await api('/reports');content.innerHTML='<div class="box"><table class="table"><tr><th>ID</th><th>Signalé</th><th>Motif</th><th>Détails</th><th>Action</th></tr>'+x.reports.map(r=>`<tr><td>${r.id}</td><td>${esc(r.target_name)}</td><td>${esc(r.reason)}</td><td>${esc(r.details)}</td><td><button class="btn btn-primary" onclick="resolve(${r.id},'resolved')">Classer</button><button class="btn btn-danger" onclick="resolve(${r.id},'confirmed')">Confirmer</button></td></tr>`).join('')+'</table></div>'}else if(page==='ips'){const x=await api('/ips');content.innerHTML='<div class="box"><div class="toolbar"><input id="ip" placeholder="Adresse IP"><input id="reason" placeholder="Motif"><button class="btn btn-danger" onclick="blockIp()">Bloquer</button></div><table class="table"><tr><th>IP</th><th>Action</th><th>Motif</th><th>Créée</th><th></th></tr>'+x.ips.map(i=>`<tr><td>${esc(i.ip)}</td><td>${i.action}</td><td>${esc(i.reason)}</td><td>${i.created_at}</td><td><button class="btn btn-light" onclick="unblockIp('${esc(i.ip)}')">Débloquer</button></td></tr>`).join('')+'</table></div>'}else if(page==='ledger'){const x=await api('/ledger');content.innerHTML='<div class="box"><h2>Ledger financier</h2><table class="table"><tr><th>Date</th><th>Type</th><th>Montant</th><th>Statut</th><th>Référence</th></tr>'+x.ledger.map(i=>`<tr><td>${i.created_at}</td><td>${esc(i.type)}</td><td>${Number(i.amount).toFixed(2)} €</td><td>${esc(i.status)}</td><td>${esc(i.reference)}</td></tr>`).join('')+'</table></div>'}else{const x=await api('/audit');content.innerHTML='<div class="box"><table class="table"><tr><th>Date</th><th>Admin</th><th>Action</th><th>Cible</th><th>IP</th></tr>'+x.logs.map(i=>`<tr><td>${i.created_at}</td><td>${esc(i.admin_name)}</td><td>${esc(i.action)}</td><td>${esc(i.target_type)} #${i.target_id||''}</td><td>${esc(i.ip)}</td></tr>`).join('')+'</table></div>'}}catch(e){content.innerHTML='<div class="box"><b>Accès refusé</b><p>'+esc(e.message)+'</p></div>'}}async function loadUsers(){show('users',document.querySelector('.side button:nth-child(2)'))}async function ban(id){const reason=prompt('Motif du bannissement ?');if(reason===null)return;await api('/users/'+id+'/ban',{method:'POST',body:JSON.stringify({reason})});loadUsers()}async function unban(id){await api('/users/'+id+'/unban',{method:'POST',body:'{}'});loadUsers()}async function resolve(id,status){await api('/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({status})});show('reports',document.querySelector('.side button:nth-child(4)'))}async function blockIp(){const ip=document.getElementById('ip').value,reason=document.getElementById('reason').value;if(!ip)return;await api('/ips/block',{method:'POST',body:JSON.stringify({ip,reason})});show('ips',document.querySelector('.side button:nth-child(5)'))}async function unblockIp(ip){await api('/ips/unblock',{method:'POST',body:JSON.stringify({ip})});show('ips',document.querySelector('.side button:nth-child(5)'))}show('overview',document.querySelector('.side button.active'));</script></body></html>
