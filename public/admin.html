<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locly — Administration</title>
<style>
:root{--navy:#0F3554;--teal:#1AA696;--teal2:#118879;--slate:#5A7182;--line:#D0D7DE;--bg:#F5F7F9;--card:#fff;--danger:#C0392B;--warn:#B7791F;--shadow:0 12px 35px rgba(15,53,84,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy);background:var(--bg)}button,input,select{font:inherit}.shell{display:flex;min-height:100vh}.side{width:260px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:10}.logo{display:flex;align-items:center;gap:9px;padding:8px 10px 25px;font-weight:900;font-size:24px}.logo b{color:var(--teal)}.admin-badge{font-size:10px;background:#e7f7f4;color:var(--teal2);padding:4px 7px;border-radius:99px;letter-spacing:.08em}.nav-label{font-size:10px;text-transform:uppercase;color:#8a9aa5;font-weight:800;padding:13px 12px 7px;letter-spacing:.1em}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#536b79;text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:10px}.nav button:hover{background:#f1f6f7;color:var(--navy)}.nav button.active{background:#e7f7f4;color:var(--teal2);font-weight:800}.nav .ico{width:22px;text-align:center}.side-bottom{position:absolute;left:14px;right:14px;bottom:18px;border-top:1px solid #edf0f2;padding:15px 10px;color:var(--slate);font-size:12px}.main{margin-left:260px;width:calc(100% - 260px);padding:28px 34px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.kicker{font-size:11px;color:var(--teal);font-weight:900;text-transform:uppercase;letter-spacing:.12em}.topbar h1{margin:4px 0 3px;font-size:29px;letter-spacing:-.03em}.sub{color:var(--slate);font-size:14px}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{background:#fff5f4;border-color:#efc7c2;color:var(--danger)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.metric-top{display:flex;justify-content:space-between;align-items:center}.metric-icon{width:38px;height:38px;border-radius:11px;background:#eef7f6;display:grid;place-items:center}.metric span{display:block;color:var(--slate);font-size:12px;margin-top:14px}.metric strong{display:block;font-size:27px;margin-top:3px}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}.head{padding:17px 19px;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{font-size:16px;margin:0}.head small{color:var(--slate)}.body{padding:19px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.quick button{text-align:left;min-height:92px;display:flex;flex-direction:column;justify-content:center}.quick strong{font-size:14px}.quick small{margin-top:5px;color:var(--slate)}.status{display:flex;align-items:center;gap:8px;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.input,.select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;color:var(--navy);outline:none}.input:focus,.select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,166,150,.1)}.input.search{flex:1;min-width:240px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px 11px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:middle}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#81919b}.table td{font-size:13px}.table tr:last-child td{border-bottom:0}.muted{color:var(--slate);font-size:12px}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:4px 9px;background:#e7f7f4;color:#087f72;font-size:11px;font-weight:800}.pill.red{background:#fff0ee;color:var(--danger)}.pill.gray{background:#f0f3f5;color:#61737f}.empty{text-align:center!important;color:var(--slate);padding:34px!important}.alert{border-radius:12px;padding:13px 14px;background:#fff8e8;color:#805d18}.alert.red{background:#fff0ee;color:#8e2c22}.activity{display:grid;gap:10px}.activity-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #edf0f2}.activity-item:last-child{border:0}.activity-icon{width:34px;height:34px;border-radius:10px;background:#eef7f6;display:grid;place-items:center;flex:0 0 auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.searchbar{position:relative}.searchbar kbd{position:absolute;right:10px;top:8px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;color:#82919a;font-size:10px;background:#fafafa}@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:760px){.side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.shell{display:block}.main{margin:0;width:100%;padding:18px}.side-bottom{position:static;margin-top:15px}.nav{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start}.top-actions{display:none}}@media(max-width:480px){.metrics,.quick{grid-template-columns:1fr}.main{padding:13px}.topbar h1{font-size:24px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="logo">L<span>o</span>cly <span class="admin-badge">ADMIN</span></div>
  <div class="nav-label">Pilotage</div>
  <nav class="nav">
    <button data-page="overview" class="active" onclick="show('overview',this)"><span class="ico">▦</span> Vue générale</button>
    <button data-page="users" onclick="show('users',this)"><span class="ico">♙</span> Utilisateurs</button>
    <button data-page="reports" onclick="show('reports',this)"><span class="ico">!</span> Signalements</button>
    <button data-page="presence" onclick="show('presence',this)"><span class="ico">●</span> Présence</button>
  </nav>
  <div class="nav-label">Sécurité & finance</div>
  <nav class="nav">
    <button data-page="ips" onclick="show('ips',this)"><span class="ico">◈</span> Sécurité & IP</button>
    <button data-page="ledger" onclick="show('ledger',this)"><span class="ico">€</span> Finance</button>
    <button data-page="audit" onclick="show('audit',this)"><span class="ico">≡</span> Journal d'audit</button>
  </nav>
  <div class="side-bottom"><b>Locly Admin</b><br>Centre de contrôle sécurisé</div>
</aside>
<main class="main">
<header class="topbar"><div><div class="kicker">Locly Administration</div><h1 id="title">Vue générale</h1><div id="subtitle" class="sub">Pilotage de la marketplace</div></div><div class="top-actions"><button class="btn" onclick="refresh()">↻ Actualiser</button></div></header>
<section id="content"></section>
</main>
</div>
<script>
'use strict';
const token=localStorage.getItem('locly_token')||localStorage.getItem('token');
const content=document.getElementById('content'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle');
const ADMIN_API=`${location.protocol}//${location.hostname}:3001`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
async function api(path,options={}){if(!token)throw new Error('Session administrateur absente. Reconnecte-toi.');const r=await fetch(ADMIN_API+'/api/admin'+path,{...options,headers:{...(options.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Erreur serveur (${r.status})`);return d}
function setPage(n,d){title.textContent=n;subtitle.textContent=d}
function setActive(b){document.querySelectorAll('.nav button[data-page]').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}
function fail(e){content.innerHTML=`<div class="card"><div class="body"><div class="alert red"><b>Impossible de charger cette section</b><br>${esc(e.message)}</div><br><button class="btn primary" onclick="refresh()">Réessayer</button></div></div>`}
async function show(page,btn){setActive(btn||document.querySelector(`.nav button[data-page="${page}"]`));try{const pages={overview,users,reports,ips,ledger,audit,presence};if(!pages[page])throw new Error('Section inconnue');await pages[page]()}catch(e){fail(e)}}
async function overview(){setPage('Vue générale','Pilotage de la marketplace Locly');const x=await api('/overview');content.innerHTML=`<div class="metrics"><div class="metric"><div class="metric-top"><span>Utilisateurs</span><div class="metric-icon">♙</div></div><strong>${Number(x.users||0)}</strong><div class="muted">Comptes enregistrés</div></div><div class="metric"><div class="metric-top"><span>Actifs</span><div class="metric-icon">✓</div></div><strong>${Number(x.active||0)}</strong><div class="muted">Comptes actifs</div></div><div class="metric"><div class="metric-top"><span>Suspendus</span><div class="metric-icon">!</div></div><strong>${Number(x.suspended||0)}</strong><div class="muted">Modération</div></div><div class="metric"><div class="metric-top"><span>Annonces</span><div class="metric-icon">▦</div></div><strong>${Number(x.listings||0)}</strong><div class="muted">Matériel publié</div></div><div class="metric"><div class="metric-top"><span>En ligne</span><div class="metric-icon">●</div></div><strong>${Number(x.online||0)}</strong><div class="muted"><span class="status"><i class="dot"></i> Temps réel</span></div></div></div><div class="grid"><div class="card"><div class="head"><div><h2>Actions rapides</h2><small>Accès direct aux opérations fréquentes</small></div></div><div class="body"><div class="quick"><button class="btn" onclick="show('users')"><strong>♙ Gérer les utilisateurs</strong><small>Rôles, comptes et sanctions</small></button><button class="btn" onclick="show('reports')"><strong>! Traiter les signalements</strong><small>Litiges et modération</small></button><button class="btn" onclick="show('ips')"><strong>◈ Centre de sécurité</strong><small>IP et prévention des abus</small></button><button class="btn" onclick="show('presence')"><strong>● Voir la présence</strong><small>Utilisateurs actuellement en ligne</small></button></div></div></div><div class="card"><div class="head"><div><h2>État de la plateforme</h2><small>Services administratifs</small></div></div><div class="body"><div class="activity"><div class="activity-item"><div class="activity-icon">✓</div><div><b>Contrôle des rôles</b><div class="muted">RBAC actif</div></div></div><div class="activity-item"><div class="activity-icon">●</div><div><b>Présence</b><div class="muted">Heartbeat actif</div></div></div><div class="activity-item"><div class="activity-icon">◈</div><div><b>Surveillance sécurité</b><div class="muted">Contrôles réseau disponibles</div></div></div></div></div></div></div>`}
let cachedUsers=[];
async function users(){setPage('Utilisateurs','Comptes, rôles et modération');const x=await api('/users');cachedUsers=x.users||[];renderUsers(cachedUsers)}
function renderUsers(list){content.innerHTML=`<div class="card"><div class="head"><div><h2>Comptes Locly</h2><small>${list.length} résultat(s)</small></div></div><div class="body"><div class="toolbar"><div class="searchbar" style="flex:1"><input class="input search" id="userSearch" placeholder="Rechercher un nom ou un email" oninput="filterUsers()"><kbd>⌘ K</kbd></div><select class="select" id="roleFilter" onchange="filterUsers()"><option value="">Tous les rôles</option><option>user</option><option>moderator</option><option>finance</option><option>admin</option><option>superadmin</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Trust</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${list.map(userRow).join('')||'<tr><td colspan="5" class="empty">Aucun utilisateur trouvé</td></tr>'}</tbody></table></div></div></div>`}
function userRow(u){const s=u.status==='suspended';return `<tr><td><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></td><td><span class="pill ${u.role==='superadmin'?'gray':''}">${esc(u.role)}</span></td><td><b>${Number(u.trust_score||0)}</b>/100</td><td><span class="pill ${s?'red':''}">${esc(u.status)}</span></td><td><div class="actions">${s?`<button class="btn primary" onclick="unbanUser(${Number(u.id)})">Réactiver</button>`:`<button class="btn danger" onclick="banUser(${Number(u.id)})">Bannir</button>`}</div></td></tr>`}
function filterUsers(){const q=(document.getElementById('userSearch')?.value||'').toLowerCase(),r=document.getElementById('roleFilter')?.value||'';renderUsers(cachedUsers.filter(u=>(!q||(`${u.name} ${u.email}`).toLowerCase().includes(q))&&(!r||u.role===r)))}
async function banUser(id){const reason=prompt('Motif du bannissement ?');if(reason===null)return;await api('/users/'+id+'/ban',{method:'POST',body:JSON.stringify({reason})});await users()}
async function unbanUser(id){await api('/users/'+id+'/unban',{method:'POST',body:'{}'});await users()}
async function reports(){setPage('Signalements','Litiges et modération');const x=await api('/reports');content.innerHTML=`<div class="card"><div class="head"><div><h2>Signalements</h2><small>Examine et traite les signalements</small></div><span class="pill">${(x.reports||[]).length} ouverts</span></div><div class="body"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Signalé</th><th>Motif</th><th>Détails</th><th>Action</th></tr></thead><tbody>${(x.reports||[]).map(r=>`<tr><td>#${esc(r.id)}</td><td><b>${esc(r.target_name)}</b></td><td>${esc(r.reason)}</td><td>${esc(r.details)}</td><td class="actions"><button class="btn" onclick="resolveReport(${Number(r.id)},'resolved')">Classer</button><button class="btn danger" onclick="resolveReport(${Number(r.id)},'confirmed')">Confirmer</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucun signalement</td></tr>'}</tbody></table></div></div></div>`}
async function resolveReport(id,status){await api('/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({status})});await reports()}
async function ips(){setPage('Sécurité & IP','Contrôles réseau et prévention');const x=await api('/ips');content.innerHTML=`<div class="card"><div class="head"><div><h2>Contrôle des IP</h2><small>Bloque et surveille les adresses signalées</small></div></div><div class="body"><div class="toolbar"><input class="input" id="ip" placeholder="Adresse IP"><input class="input" id="reason" placeholder="Motif"><button class="btn danger" onclick="blockIp()">Bloquer l'IP</button></div><div class="table-wrap"><table class="table"><thead><tr><th>IP</th><th>Action</th><th>Motif</th><th>Date</th><th></th></tr></thead><tbody>${(x.ips||[]).map(i=>`<tr><td><b>${esc(i.ip)}</b></td><td>${esc(i.action)}</td><td>${esc(i.reason)}</td><td>${esc(i.created_at)}</td><td><button class="btn" onclick='unblockIp(${JSON.stringify(i.ip)})'>Débloquer</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucune IP enregistrée</td></tr>'}</tbody></table></div></div></div>`}
async function blockIp(){const ip=document.getElementById('ip')?.value.trim(),reason=document.getElementById('reason')?.value.trim();if(!ip)return alert('Adresse IP requise');await api('/ips/block',{method:'POST',body:JSON.stringify({ip,reason})});await ips()}
async function unblockIp(ip){await api('/ips/unblock',{method:'POST',body:JSON.stringify({ip})});await ips()}
async function ledger(){setPage('Finance','Suivi des mouvements');const x=await api('/ledger');content.innerHTML=`<div class="card"><div class="head"><div><h2>Ledger financier</h2><small>Historique des mouvements</small></div></div><div class="body"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Montant</th><th>Statut</th><th>Référence</th></tr></thead><tbody>${(x.ledger||[]).map(i=>`<tr><td>${esc(i.created_at)}</td><td>${esc(i.type)}</td><td><b>${money(i.amount)}</b></td><td><span class="pill">${esc(i.status)}</span></td><td>${esc(i.reference)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucun mouvement</td></tr>'}</tbody></table></div></div></div>`}
async function audit(){setPage('Journal d’audit','Traçabilité des actions administratives');const x=await api('/audit');content.innerHTML=`<div class="card"><div class="head"><div><h2>Journal d’audit</h2><small>Actions administratives traçables</small></div></div><div class="body"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Cible</th><th>IP</th></tr></thead><tbody>${(x.logs||[]).map(i=>`<tr><td>${esc(i.created_at)}</td><td>${esc(i.admin_name)}</td><td><b>${esc(i.action)}</b></td><td>${esc(i.target_type)} #${esc(i.target_id||'')}</td><td>${esc(i.ip)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucun événement</td></tr>'}</tbody></table></div></div></div>`}
async function presence(){setPage('Présence','Activité en temps réel');const r=await fetch('/api/presence/stats',{headers:{Authorization:'Bearer '+token}}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||'Présence indisponible');content.innerHTML=`<div class="metrics"><div class="metric"><div class="metric-top"><span>En ligne</span><div class="metric-icon">●</div></div><strong>${Number(x.online||0)}</strong><div class="muted">Sessions actives</div></div><div class="metric"><div class="metric-top"><span>Comptes</span><div class="metric-icon">♙</div></div><strong>${Number(x.authenticated||0)}</strong><div class="muted">Utilisateurs connectés</div></div><div class="metric"><div class="metric-top"><span>Visiteurs</span><div class="metric-icon">○</div></div><strong>${Number(x.guests||0)}</strong><div class="muted">Sans compte</div></div><div class="metric"><div class="metric-top"><span>Aujourd'hui</span><div class="metric-icon">▣</div></div><strong>${Number(x.today||0)}</strong><div class="muted">Présences enregistrées</div></div></div><div class="card"><div class="head"><div><h2>Présence en direct</h2><small>Les sessions sont mises à jour par heartbeat</small></div><span class="status"><i class="dot"></i> En direct</span></div><div class="body"><div class="alert">Les données de présence sont utilisées pour les statistiques et la sécurité de la plateforme.</div><br><button class="btn primary" onclick="presence()">↻ Actualiser</button></div></div>`}
function refresh(){show('overview')}
show('overview');
</script>
</body>
</html>
